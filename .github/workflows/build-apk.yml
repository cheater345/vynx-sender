name: Build Vynx Sender APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"

      - name: Sign and Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk vynx-sender.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            vynx-sender.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify vynx-sender.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vynx-sender-signed
          path: vynx-sender.apk
